AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EC2 Control Portal - ACM Certificate Stack
  Deploy this stack in us-east-1 ONLY (required for CloudFront).
  CloudFormation auto-validates the certificate via Route 53.
  Run ONCE per AWS account. Copy the CertificateArn output to deploy-config.env.

Parameters:

  DomainName:
    Type: String
    Default: www.solobil.com
    Description: >
      Primary domain for the portal certificate.
      Example: www.solobil.com

  ApexDomain:
    Type: String
    Default: ''
    Description: >
      Naked/apex domain to include as a Subject Alternative Name (e.g. solobil.com).
      Leave blank to create a cert for DomainName only.

  HostedZoneId:
    Type: String
    Description: >
      Route 53 Hosted Zone ID for your domain.
      Find it in AWS Console → Route 53 → Hosted zones → your domain → Hosted zone ID.
      Example: Z1PA6795UKMFR9

Conditions:
  HasApexDomain: !Not [!Equals [!Ref ApexDomain, '']]

Resources:

  PortalCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: !If
        - HasApexDomain
        - - !Ref DomainName
          - !Ref ApexDomain
        - !Ref AWS::NoValue
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - !If
          - HasApexDomain
          - DomainName: !Ref ApexDomain
            HostedZoneId: !Ref HostedZoneId
          - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: EC2Control
        - Key: Domain
          Value: !Ref DomainName

Outputs:

  CertificateArn:
    Description: >
      Copy this ARN into deploy-config.env as ACM_CERT_ARN=<value>
      Then run ./deploy.sh to deploy the main stack with custom domain support.
    Value: !Ref PortalCertificate

  DomainName:
    Description: Domain this certificate is valid for.
    Value: !Ref DomainName
