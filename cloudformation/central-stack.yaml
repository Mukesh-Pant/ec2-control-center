      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceLabsPricing
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # =============================================
  # REST API - /labs/network-options (M11)
  # =============================================
  MethodGetLabsNetworkOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceLabsNetworkOptions
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref RestApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MainLambda.Arn}/invocations'

  MethodOptionsLabsNetworkOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceLabsNetworkOptions
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # =============================================
  # REST API - Deployment + Stage
  # =============================================
  RestApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - MethodPostEc2
      - MethodOptionsEc2
      - MethodGetAccounts
      - MethodPostAccounts
      - MethodOptionsAccounts
      - MethodGetAudit
      - MethodOptionsAudit
      - MethodGetAuditDaily
      - MethodOptionsAuditDaily
      - MethodGetPricing
      - MethodOptionsPricing
      - MethodGetUsers
      - MethodPostUsers
      - MethodOptionsUsers
      - MethodGetBackup
      - MethodPostBackup
      - MethodOptionsBackup
      - MethodPostConsoleLogin
      - MethodOptionsConsoleLogin
      - MethodGetLabs
      - MethodPostLabs
      - MethodDeleteLabs
      - MethodOptionsLabs
      - MethodGetLabsPayment
      - MethodPostLabsPayment
      - MethodOptionsLabsPayment
      - MethodGetLabsKeypair
      - MethodOptionsLabsKeypair
      - MethodGetLabsWindowsPassword
      - MethodOptionsLabsWindowsPassword
      - MethodGetLabsPricing
      - MethodOptionsLabsPricing
      - MethodGetLabsNetworkOptions
      - MethodOptionsLabsNetworkOptions
    Properties:
      RestApiId: !Ref RestApi
      Description: !Sub 'Deployment ${LambdaCodeVersion}-m11-labs'

  RestApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref RestApiDeployment
      StageName: prod
      Description: !Sub 'Production stage - ${Environment}'

  # =============================================
  # LAMBDA PERMISSION - REST API
  # =============================================
  MainLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MainLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*'

  # =============================================
  # SEED ACCOUNT - Registers central account
  # =============================================
  SeedAccountLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'ec2-seed-account-${Environment}'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          import boto3
          import json
          import urllib.request

          def send_response(event, status, reason='OK', data={}):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason,
                  'PhysicalResourceId': event.get('PhysicalResourceId', 'seed-account'),
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data
              }).encode('utf-8')
              req = urllib.request.Request(
                  url=event['ResponseURL'],
                  data=body,
                  method='PUT'
              )
              req.add_header('Content-Type', '')
              req.add_header('Content-Length', len(body))
              urllib.request.urlopen(req)

          def handler(event, context):
              print("Event:", json.dumps(event))
              try:
                  if event['RequestType'] in ('Create', 'Update'):
                      props = event['ResourceProperties']
                      ddb = boto3.resource('dynamodb')
                      table = ddb.Table(props['TableName'])
                      table.put_item(Item={
                          'accountId': props['AccountId'],
                          'accountName': 'Central Account',
                          'roleArn': 'LOCAL',
                          'enabled': True
                      })
                      print("Seeded central account:", props['AccountId'])
                  send_response(event, 'SUCCESS')
              except Exception as e:
                  print("FAILED:", str(e))
                  send_response(event, 'FAILED', str(e))

  SeedAccountResource:
    Type: Custom::SeedAccount
    DependsOn: AccountRegistryTable
    Properties:
      ServiceToken: !GetAtt SeedAccountLambda.Arn
      TableName: !Ref AccountRegistryTable
      AccountId: !Ref 'AWS::AccountId'

  # =============================================
  # SNS TOPIC - Idle auto-stop notifications (M4)
  # =============================================
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'ec2-control-alerts-${Environment}'
      DisplayName: EC2 Control Portal Alerts
      Tags:
        - Key: Project
          Value: EC2Control
        - Key: Environment
          Value: !Ref Environment

  NotificationSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref NotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # =============================================
  # IDLE CHECKER LAMBDA (M4)
  # =============================================
  IdleCheckerLambda:
    Type: AWS::Lambda::Function
    DependsOn: LambdaExecutionRole
    Properties:
      FunctionName: !Sub 'ec2-idle-checker-${Environment}'
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Sub 'lambda/idle-checker-${Environment}-${LambdaCodeVersion}.zip'
      Environment:
        Variables:
          ACCOUNTS_TABLE: !Ref AccountRegistryTable
          AUDIT_TABLE: !Ref AuditLogTable
          SNS_TOPIC_ARN: !Ref NotificationTopic
          ENVIRONMENT: !Ref Environment
          CENTRAL_ACCOUNT_ID: !Ref 'AWS::AccountId'
          CPU_THRESHOLD: !Sub '${CpuThreshold}'
          IDLE_WINDOW_MIN: !Sub '${IdleWindowMinutes}'
      Tags:
        - Key: Project
          Value: EC2Control
        - Key: Environment
          Value: !Ref Environment

  # =============================================
  # EVENTBRIDGE RULE - Trigger idle checker every 15 min (M4)
  # =============================================
  IdleCheckerSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'ec2-idle-checker-schedule-${Environment}'
      Description: Triggers idle checker Lambda every 15 minutes
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Id: IdleCheckerTarget
          Arn: !GetAtt IdleCheckerLambda.Arn

  IdleCheckerSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt IdleCheckerLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IdleCheckerSchedule.Arn

  # =============================================
  # LABS EXPIRY CHECKER LAMBDA (M11)
  # =============================================
  LabsExpiryCheckerLambda:
    Type: AWS::Lambda::Function
    DependsOn: LambdaExecutionRole
    Properties:
      FunctionName: !Sub 'ec2-labs-expiry-checker-${Environment}'
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 128
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Sub 'lambda/labs-expiry-checker-${Environment}-${LambdaCodeVersion}.zip'
      Environment:
        Variables:
          LABS_TABLE: !Ref LabsTable
          SNS_TOPIC_ARN: !Ref NotificationTopic
          ENVIRONMENT: !Ref Environment
          CENTRAL_ACCOUNT_ID: !Ref 'AWS::AccountId'
      Tags:
        - Key: Project
          Value: EC2Control
        - Key: Environment
          Value: !Ref Environment

  LabsExpiryCheckerSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'ec2-labs-expiry-checker-schedule-${Environment}'
      Description: Triggers labs expiry checker Lambda every 15 minutes
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Id: LabsExpiryCheckerTarget
          Arn: !GetAtt LabsExpiryCheckerLambda.Arn

  LabsExpiryCheckerSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LabsExpiryCheckerLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LabsExpiryCheckerSchedule.Arn

# =============================================
# ROUTE 53 - Custom domain A ALIAS record
# Created only when CustomDomain + HostedZoneId are set
# =============================================
  PortalDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront global hosted zone ID (always this value)
        EvaluateTargetHealth: false

  ApexDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasApexDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApexDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

# =============================================
# OUTPUTS
# =============================================
Outputs:

  PortalURL:
    Description: Portal URL - open in browser after deployment completes.
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${CustomDomain}'
      - !Sub 'https://${CloudFrontDistribution.DomainName}'

  CloudFrontURL:
    Description: CloudFront auto-generated URL (always available, useful for debugging).
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  S3BucketName:
    Description: S3 bucket storing frontend files (managed by Config Injector).
    Value: !Ref PortalBucket

  ApiURL:
    Description: 'REST API endpoint URL (stage: prod).'
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod'

  RestApiId:
    Description: REST API Gateway ID (used by deploy.sh to flush deployment snapshot).
    Value: !Ref RestApi

  CognitoUserPoolId:
    Description: Use this to add more users via CLI.
    Value: !Ref CognitoUserPool

  CognitoClientId:
    Description: Cognito App Client ID (auto-injected into frontend).
    Value: !Ref CognitoAppClient

  CloudFrontDistributionId:
    Description: CloudFront distribution ID for manual cache invalidation if needed.
    Value: !Ref CloudFrontDistribution

  AccountRegistryTable:
    Description: DynamoDB table for registered AWS accounts.
    Value: !Ref AccountRegistryTable

  AuditLogTable:
    Description: DynamoDB audit log table (90-day TTL). M2.
    Value: !Ref AuditLogTable

  UserAccountsTable:
    Description: DynamoDB user-account assignments table (RBAC). M8.
    Value: !Ref UserAccountsTable

  BackupVaultArn:
    Description: AWS Backup Vault ARN for EC2 recovery points. M9.
    Value: !GetAtt BackupVault.BackupVaultArn

  BackupServiceRoleArn:
    Description: IAM role used by AWS Backup service. M9.
    Value: !GetAtt BackupServiceRole.Arn

  NotificationTopicArn:
    Description: SNS topic ARN for idle auto-stop alerts. M4.
    Value: !Ref NotificationTopic

  IdleCheckerFunction:
    Description: Idle checker Lambda function name. M4.
    Value: !Ref IdleCheckerLambda

  LabsTable:
    Description: DynamoDB table for EC2 labs (M11).
    Value: !Ref LabsTable

  LabsExpiryCheckerFunction:
    Description: Labs expiry checker Lambda function name. M11.
    Value: !Ref LabsExpiryCheckerLambda
