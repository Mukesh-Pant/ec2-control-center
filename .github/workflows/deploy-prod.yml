name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC token request
  contents: read

jobs:
  deploy-prod:
    name: Deploy (prod)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.PROD_AWS_REGION }}

      - name: Reconstruct deploy-config.env from secrets
        env:
          ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          COGNITO_DOMAIN_PREFIX: ${{ secrets.PROD_COGNITO_DOMAIN_PREFIX }}
          ENVIRONMENT: ${{ secrets.PROD_ENVIRONMENT }}
          AWS_REGION: ${{ secrets.PROD_AWS_REGION }}
          NOTIFICATION_EMAIL: ${{ secrets.PROD_NOTIFICATION_EMAIL }}
          CUSTOM_DOMAIN: ${{ secrets.PROD_CUSTOM_DOMAIN }}
          APEX_DOMAIN: ${{ secrets.PROD_APEX_DOMAIN }}
          ACM_CERT_ARN: ${{ secrets.PROD_ACM_CERT_ARN }}
          HOSTED_ZONE_ID: ${{ secrets.PROD_HOSTED_ZONE_ID }}
        run: |
          {
            echo "ADMIN_EMAIL=$ADMIN_EMAIL"
            echo "COGNITO_DOMAIN_PREFIX=$COGNITO_DOMAIN_PREFIX"
            echo "ENVIRONMENT=$ENVIRONMENT"
            echo "AWS_REGION=$AWS_REGION"
            echo "NOTIFICATION_EMAIL=$NOTIFICATION_EMAIL"
            echo "CUSTOM_DOMAIN=$CUSTOM_DOMAIN"
            echo "APEX_DOMAIN=$APEX_DOMAIN"
            echo "ACM_CERT_ARN=$ACM_CERT_ARN"
            echo "HOSTED_ZONE_ID=$HOSTED_ZONE_ID"
          } > deploy-config.env

      - name: Deploy to production
        id: deploy
        run: bash deploy.sh

      - name: Show CloudFormation failure events
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          AWS_REGION: ${{ secrets.PROD_AWS_REGION }}
          ENVIRONMENT: ${{ secrets.PROD_ENVIRONMENT }}
        run: |
          echo "==> CloudFormation stack events (last 20, failures only):"
          aws cloudformation describe-stack-events \
            --stack-name "ec2-control-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --query 'StackEvents[?contains(`["UPDATE_FAILED","CREATE_FAILED","DELETE_FAILED"]`, ResourceStatus)].[Timestamp,ResourceType,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
            --output table | head -80
